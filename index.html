<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Riot Games</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <form action="" class="form">
        <div class="login-logo">
            <img src="img/riot-logo.png" alt="">
        </div>
        
        <h2>SING IN</h2>
        <div class="group">
            <div class="inputs">
                <input type="email" name="email" id="email" placeholder="E-mail">
                
                <input type="password" name="password" id="passwor" placeholder="Password">
            </div>
            
            <label for="#" class="remember-me">
                <div class="container-checkbox">
                    <input type="checkbox" name="remember-me" class="checkbox" value="sim">
                    <span>Lembrar-me</span>
                </div>
                <a href="#">Esqueceu a senha?</a>
            </label>
            
            <div class="btn-container">
                <button class="btn-sing-in">SING IN</button>
            </div>
            
            <div class="singn-up">
                <p>Não tem uma conta?</p>
                <a href="">Criar</a>
            </div>
            
            <div class="other-singn-up">
                <p>Ou entrar com:</p>
                <button type="button" class="btn-singn-up">
                    <img src="img/google-logo-icon.png" alt="">
                </button>
                <button type="button" class="btn-singn-up  btn-xbox">
                    <img src="img/logo-xbox.png" alt="">
                </button>
            </div>
            
        </div>
    </form>
</body>

</html>
