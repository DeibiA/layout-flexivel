<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Riot Games</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="login-container">
        <form action="" class="form">
            <div class="login-logo">
                <img src="img/riot-logo.png" alt="">
            </div>

            <h2>SING IN</h2>
            <div class="group">
                <div class="inputs">
                    <input type="email" name="email" id="email" placeholder="E-mail">

                    <input type="password" name="password" id="passwor" placeholder="Password">
                </div>

                <label for="" class="remember-me">
                    <div class="container-checkbox">
                        <input type="checkbox" name="remember-me" class="checkbox" value="sim">
                        <span>Lembrar-me</span>
                    </div>
                    <a href="#">Esqueceu a senha?</a>
                </label>
                
                <button>SING IN</button>
            </div>

        </form>

        <img src="img/login-riot-background.jpg" alt="" class="img-background">
        
    </div>
</body>
</html>
